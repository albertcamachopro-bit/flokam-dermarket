<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de entrega | FLOKAM Dermarket</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <header class="topbar">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="FLOKAM Dermarket">
        <span class="brand-mark"><i data-lucide="droplets" class="icon"></i></span>
        <span class="brand-name">FLOKAM Dermarket <small>Cuidado capilar especializado</small></span>
      </a>
      <nav class="nav-links" aria-label="Navegación principal">
        <a href="index.html" data-nav="home">Inicio</a>
        <a href="catalogo-q24.html" data-nav="q24">Productos</a>
        <a href="guia-capilar.html" data-nav="guia">Detalles</a>
        <a href="contacto.html" data-nav="contacto">Contacto</a>
        <a class="cart-pill" href="carrito.html" data-nav="carrito">Carrito <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section checkout-entry" id="datos-comprador">
      <div class="container checkout-entry-grid">
        <div>
          <div class="tagline"><i data-lucide="clipboard-check" class="icon"></i> Datos de compra</div>
          <h1 class="page-title">Datos de entrega.</h1>
          <p class="lead">Completa la información real de quien recibirá el pedido. El carrito la usará automáticamente al enviar la solicitud por WhatsApp.</p>
          <div class="buyer-status" data-customer-home-status>Datos pendientes.</div>
        </div>

        <form class="form-panel checkout-form" data-customer-form>
          <div class="form-grid">
            <div class="field full">
              <label for="customer-name">Nombre y apellido</label>
              <input id="customer-name" name="fullName" type="text" autocomplete="name" placeholder="Ej. Jose Martinez" data-customer-field="fullName" required>
            </div>
            <div class="field full">
              <label for="customer-address">Dirección de entrega</label>
              <input id="customer-address" name="address" type="text" autocomplete="street-address" placeholder="Ej. CRA 54A #10-23, Barranquilla" data-customer-field="address" required>
            </div>
            <div class="field">
              <label for="customer-id-type">Tipo de identificación</label>
              <select id="customer-id-type" name="idType" data-customer-field="idType" required>
                <option value="">Seleccionar</option>
                <option value="CC">CC</option>
                <option value="CE">CE</option>
                <option value="TI">TI</option>
                <option value="PASAPORTE">Pasaporte</option>
                <option value="NIT">NIT</option>
              </select>
            </div>
            <div class="field">
              <label for="customer-id-number">Número de identificación</label>
              <input id="customer-id-number" name="idNumber" type="text" inputmode="numeric" autocomplete="off" placeholder="Ej. 1234567890" data-customer-field="idNumber" required>
            </div>
            <div class="field full">
              <label for="customer-payment">Método de pago</label>
              <select id="customer-payment" name="paymentMethod" data-customer-field="paymentMethod" required>
                <option value="">Seleccionar</option>
                <option value="POR TRANSFERENCIA">Por transferencia</option>
                <option value="POR NEQUI">Por Nequi</option>
                <option value="POR DAVIPLATA">Por Daviplata</option>
                <option value="EN EFECTIVO">En efectivo</option>
                <option value="CONTRAENTREGA">Contraentrega</option>
              </select>
            </div>
          </div>

          <div class="hero-actions">
            <button class="btn btn-primary" type="submit"><i data-lucide="save" class="icon"></i> Guardar datos</button>
            <a class="btn" href="catalogo-q24.html"><i data-lucide="shopping-bag" class="icon"></i> Ver productos</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="store.js" charset="UTF-8"></script>
</body>
</html>
